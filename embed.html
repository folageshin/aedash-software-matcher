<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AEDash Software Matcher</title>
<style>
html,body{margin:0;padding:0;background:transparent;overflow:hidden}
#frame{width:100%;height:600px;border:0;display:block;background:transparent;overflow:hidden}
</style>
</head>
<body>
<iframe id="frame" src="./index.html" title="AEDash Accounting Software Matcher" scrolling="no"></iframe>
<script>
const frame=document.getElementById('frame');
function tellParentHeight(){
  const h=Math.ceil(frame.getBoundingClientRect().height);
  window.parent.postMessage({type:'aedash-resize',height:h},'*');
}
frame.addEventListener('load',()=>{
  try{
    const doc=frame.contentDocument||frame.contentWindow.document;
    const header=doc.querySelector('header');
    const footer=doc.querySelector('footer');
    const progress=doc.querySelector('.progress');
    if(header) header.style.display='none';
    if(footer) footer.style.display='none';
    if(progress) progress.style.display='none';

    const wrap=doc.querySelector('.wrap');
    if(wrap){
      wrap.style.padding='0';
      wrap.style.margin='0';
      wrap.style.maxWidth='100%';
      wrap.style.width='100%';
    }

    const quiz=doc.querySelector('#quiz');
    const results=doc.querySelector('#results');
    [quiz,results].forEach(el=>{
      if(el){
        el.style.marginTop='0';
        el.style.width='100%';
      }
    });

    doc.documentElement.style.overflow='hidden';
    doc.body.style.overflow='hidden';
    doc.body.style.background='transparent';
    doc.body.style.margin='0';
    doc.body.style.padding='0';

    const resize=()=>{
      try{
        const visible=doc.querySelector('#results:not(.hidden)') || doc.querySelector('#quiz:not(.hidden)');
        let h;
        if(visible){
          const rect=visible.getBoundingClientRect();
          h=Math.ceil(rect.bottom + 4);
        }else{
          h=Math.ceil(Math.max(doc.documentElement.scrollHeight,doc.body.scrollHeight));
        }
        h=Math.max(330,h);
        frame.style.height=h+'px';
        tellParentHeight();
      }catch(e){}
    };

    resize();
    const observer=new MutationObserver(resize);
    observer.observe(doc.body,{childList:true,subtree:true,attributes:true,characterData:true});
    window.addEventListener('resize',resize);
    setTimeout(resize,250);
    setTimeout(resize,750);
  }catch(e){tellParentHeight();}
});
window.addEventListener('load',tellParentHeight);
</script>
</body>
</html>
